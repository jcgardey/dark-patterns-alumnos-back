services:
  dark-patterns-back:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "5000:5000"

    volumes:
      - .:/usr/src/app

    environment:
      PYTHONUNBUFFERED: "1"
      FLASK_DEBUG: "0"

    command:
      - gunicorn
      - --bind=0.0.0.0:5000
      - --workers=2
      - --threads=4
      - --timeout=120
      - app:app
