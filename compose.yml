services:
  dark-patterns-back:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "5000:5000"

    volumes:
      - .:/usr/src/app

    environment:
      PYTHONUNBUFFERED: "1"
      FLASK_DEBUG: "1"

    command:
      - flask
      - run
      - --host=0.0.0.0
      - --port=5000
      - --debug